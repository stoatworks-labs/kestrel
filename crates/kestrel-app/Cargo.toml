[package]
name = "kestrel-app"
description = "Kestrel's runtime: the frame-path thread that ties capture, the GPU and the outputs together, plus the CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "kestrel_app"
path = "src/lib.rs"

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
kestrel-core = { path = "../kestrel-core" }
kestrel-render = { path = "../kestrel-render" }
kestrel-decklink = { path = "../kestrel-decklink" }
kestrel-control = { path = "../kestrel-control" }
diag = { path = "../diag" }

anyhow.workspace = true
parking_lot.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
